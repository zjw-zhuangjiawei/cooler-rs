[package]
name = "cooler-rs"
version = "0.2.0"
edition = "2021"
license = "MIT"
authors = ["Zhuang Jiawei <zjw@stu.scau.edu.cn>"]
description = "Read/write .cool and .mcool Hi-C contact matrix files (HDF5), plus the cooler-rs CLI (TAD calling, format conversion)"
repository = "https://github.com/zjw-zhuangjiawei/cooler-rs"
readme = "README.md"
keywords = ["cooler", "hic", "hdf5", "tad", "genomics"]
categories = ["science"]

[dependencies]
byteorder = "1.5.0"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
flate2 = "1"
hdf5-metno = { version = "0.14.0", features = ["static", "zlib"] }
libm = "0.2"
log = "0.4"
ndarray = "0.17"
rand = "0.9"
sprs = "0.11"
thiserror = "2"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.27.0"
