#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "builtin"
hooks = [
    { id = "trailing-whitespace" },
    { id = "end-of-file-fixer" },
    { id = "check-added-large-files" },
    { id = "check-merge-conflict" },
]

[[repos]]
repo = "local"
hooks = [
    { id = "cargo-fmt",    name = "cargo fmt",    language = "system", entry = "cargo fmt --", pass_filenames = false, types = ["rust"] },
    { id = "cargo-clippy", name = "cargo clippy", language = "system", entry = "cargo clippy --all-targets -- -D warnings", pass_filenames = false, types = ["rust"] },
]
